[build]
  command = "npm install && npm run build"
  publish = "dist"

# Force www → apex to match canonical URLs (https://tomasfigueroa.com)
[[redirects]]
  from = "https://www.tomasfigueroa.com/*"
  to = "https://tomasfigueroa.com/:splat"
  status = 301
  force = true

# SPA fallback — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

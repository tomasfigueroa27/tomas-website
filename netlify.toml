[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SITE_MODE = "staging"

# Canonical domain redirects — enforce https://www.tomasfigueroa.com/
[[redirects]]
  from   = "https://tomasfigueroa.com/*"
  to     = "https://www.tomasfigueroa.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://tomasfigueroa.com/*"
  to     = "https://www.tomasfigueroa.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.tomasfigueroa.com/*"
  to     = "https://www.tomasfigueroa.com/:splat"
  status = 301
  force  = true

# Astro SSG: serve pre-built HTML, no SPA routing needed.
# 404 fallback — Astro generates a 404.html
[[redirects]]
  from   = "/*"
  to     = "/404"
  status = 404

# API routes (Astro SSR edge function)
[[edge_functions]]
  function = "entry"
  path = "/api/*"

[build]
  command = "npm install && npm run build"
  publish = "dist"

# Disable pretty URLs to prevent Netlify from redirecting /path → /path/
# Keeps sitemap URLs and canonical tags in sync (no trailing slash)
[build.processing.html]
  pretty_urls = false

# SPA fallback — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
